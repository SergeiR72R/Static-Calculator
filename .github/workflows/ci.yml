name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
      - name: Unit tests (core, units, sections, i18n, DXF, CSV, report)
        run: npm test
        env:
          DXF_SAMPLES_DIR: dxf-samples
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ezdxf audit of generated DXF files
        run: |
          pip install ezdxf==1.4.*
          python scripts/dxf_audit.py dxf-samples
      - name: Open DXF files in LibreCAD (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librecad xvfb xauth
          scripts/librecad_check.sh dxf-samples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dxf-samples
          path: dxf-samples

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
