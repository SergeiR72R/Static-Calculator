<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Balkenrechner nach der Finite-Elemente-Methode: Durchlaufträger, Gelenke, Federlager, Lastfallkombinationen, Schnittgrößen, Durchbiegung, DXF-Export." />
    <meta name="theme-color" content="#004F7E" />
    <title>Balkenrechner – promaintain</title>
    <script>
      try {
        var t = localStorage.getItem('balken.theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
